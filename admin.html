

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель</title>


<style>
* {
  box-sizing: border-box;
}


body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #222;
}


header {
  background: #171717;
  color: white;
  padding: 20px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}


header h1 {
  margin: 0;
}


header p {
  margin-bottom: 0;
}


.container {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 15px;
}


.panel {
  background: white;
  padding: 25px;
  border-radius: 12px;
  margin-bottom: 25px;
}


h1, h2 {
  margin-top: 0;
}


input, select, textarea, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 7px;
  font-size: 15px;
}


textarea {
  min-height: 110px;
  resize: vertical;
  font-family: Arial, sans-serif;
}


button {
  background: #171717;
  color: white;
  cursor: pointer;
  border: none;
}


button:hover {
  background: #444;
}


button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}


.form-buttons {
  display: flex;
  gap: 10px;
}


.form-buttons button {
  flex: 1;
}


.cancel {
  background: #777;
}


.product {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px 0;
  border-bottom: 1px solid #eee;
}


.product img {
  width: 85px;
  height: 85px;
  object-fit: contain;
  border-radius: 8px;
  background: #f5f5f5;
}


.product-info {
  flex: 1;
  min-width: 0;
}


.product-info p {
  margin: 7px 0;
  overflow-wrap: anywhere;
}


.product-actions {
  display: flex;
  gap: 7px;
}


.product-actions button {
  width: auto;
  padding: 10px 14px;
}


.delete {
  background: #d93636;
}


.edit {
  background: #2466b1;
}


#preview {
  width: 140px;
  height: 140px;
  object-fit: contain;
  display: none;
  margin: 10px 0;
  border: 1px solid #ddd;
  border-radius: 8px;
}


.status {
  color: #666;
  font-size: 14px;
  margin: 8px 0;
}


.message {
  padding: 12px;
  border-radius: 7px;
  margin: 12px 0;
  background: #eee;
  overflow-wrap: anywhere;
}


.error {
  background: #ffe5e5;
  color: #a00000;
}


.success {
  background: #e4f6e9;
  color: #17652b;
}


#logoutButton {
  width: auto;
  padding: 10px 18px;
  margin: 0;
  background: #555;
}


#loginPanel {
  max-width: 450px;
  margin: 60px auto;
}


.hidden {
  display: none !important;
}


@media(max-width: 600px) {
  header {
    flex-direction: column;
    align-items: flex-start;
  }


  #logoutButton {
    width: 100%;
  }


  .product {
    flex-wrap: wrap;
  }


  .product-actions {
    width: 100%;
  }


  .product-actions button {
    flex: 1;
  }


  .form-buttons {
    flex-direction: column;
  }
}
</style>
</head>


<body>


<header>
  <div>
    <h1>Админ-панель магазина</h1>
    <p>Управление товарами</p>
  </div>


  <button id="logoutButton" class="hidden" type="button">
    Выйти
  </button>
</header>


<div class="container">


  <!-- ВХОД -->


  <div class="panel" id="loginPanel">
    <h2>Вход администратора</h2>


    <p class="status">
      Войди под своим аккаунтом администратора.
    </p>


    <form id="loginForm">
      <input
        id="loginEmail"
        type="email"
        placeholder="Электронная почта"
        autocomplete="username"
        required
      >


      <input
        id="loginPassword"
        type="password"
        placeholder="Пароль"
        autocomplete="current-password"
        required
      >


      <button id="loginButton" type="submit">
        Войти
      </button>
    </form>


    <div id="loginMessage"></div>
  </div>


  <!-- АДМИНКА -->


  <div id="adminContent" class="hidden">


    <div class="panel">
      <h2 id="formTitle">Добавить товар</h2>


      <form id="productForm">


        <input
          id="name"
          type="text"
          placeholder="Название товара"
          maxlength="100"
          required
        >


        <input
          id="price"
          type="number"
          step="0.01"
          min="0.01"
          placeholder="Цена (€)"
          required
        >


        <input
          id="oldPrice"
          type="number"
          step="0.01"
          min="0"
          placeholder="Старая цена (€)"
        >


        <select id="category" required>
          <option value="">Выбери категорию</option>
          <option value="Електроника">Електроника</option>
          <option value="Дрехи">Дрехи</option>
          <option value="Аксесоари">Аксесоари</option>
          <option value="За дома">За дома</option>
          <option value="Други">Други</option>
        </select>


        <textarea
          id="description"
          placeholder="Описание товара..."
          maxlength="2000"
        ></textarea>


        <label>Фотография товара:</label>


        <input
          id="image"
          type="file"
          accept="image/*"
        >


        <img id="preview" alt="Предпросмотр товара">


        <p class="status" id="imageStatus">
          Максимальный размер фотографии — 5 МБ.
        </p>


        <div class="form-buttons">
          <button type="submit" id="submitButton">
            Добавить товар
          </button>


          <button
            type="button"
            class="cancel hidden"
            id="cancelButton"
          >
            Отменить
          </button>
        </div>


      </form>


      <div id="formMessage"></div>
    </div>


    <div class="panel">
      <h2>Товары магазина</h2>


      <p id="productCount" class="status">
        Загрузка...
      </p>


      <div id="productsList"></div>
    </div>


  </div>


</div>


<script type="module">


import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* НАСТРОЙКИ SUPABASE */


const SUPABASE_URL =
  "https://pbgedgufsdmlindecayn.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_qehwDYF02Kyvyt3wrnkqnw_OPK-8u8N";


const ADMIN_UID =
  "9e31b7ee-24a6-4d07-996a-812d1ad4756f";


const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);


/* ЭЛЕМЕНТЫ */


const loginPanel = document.getElementById("loginPanel");
const adminContent = document.getElementById("adminContent");
const loginForm = document.getElementById("loginForm");
const productForm = document.getElementById("productForm");


const imageInput = document.getElementById("image");
const preview = document.getElementById("preview");


const productsList = document.getElementById("productsList");


let products = [];
let editingId = null;
let selectedImage = null;
let currentUser = null;


/* СООБЩЕНИЯ */


function showMessage(elementId, message, type = "") {
  const element = document.getElementById(elementId);


  element.textContent = message;
  element.className = "message " + type;
}


function clearMessage(elementId) {
  const element = document.getElementById(elementId);


  element.textContent = "";
  element.className = "";
}


/* ПРОВЕРКА АДМИНИСТРАТОРА */


function showLogin() {
  currentUser = null;


  loginPanel.classList.remove("hidden");
  adminContent.classList.add("hidden");


  document.getElementById("logoutButton")
    .classList.add("hidden");
}


async function showAdmin(user) {
  if (!user || user.id !== ADMIN_UID) {
    await supabase.auth.signOut();


    showLogin();


    showMessage(
      "loginMessage",
      "У этого аккаунта нет прав администратора.",
      "error"
    );


    return;
  }


  currentUser = user;


  loginPanel.classList.add("hidden");
  adminContent.classList.remove("hidden");


  document.getElementById("logoutButton")
    .classList.remove("hidden");


  await loadProducts();
}


/* ВХОД */


loginForm.addEventListener("submit", async function(event) {
  event.preventDefault();


  const email =
    document.getElementById("loginEmail").value.trim();


  const password =
    document.getElementById("loginPassword").value;


  const button = document.getElementById("loginButton");


  button.disabled = true;
  button.textContent = "Входим...";


  clearMessage("loginMessage");


  try {
    const { data, error } =
      await supabase.auth.signInWithPassword({
        email,
        password
      });


    if (error) throw error;


    if (data.user.id !== ADMIN_UID) {
      await supabase.auth.signOut();


      throw new Error(
        "Этот аккаунт не является администратором."
      );
    }


    loginForm.reset();


    await showAdmin(data.user);


  } catch (error) {
    showMessage(
      "loginMessage",
      error.message || "Не удалось войти.",
      "error"
    );
  } finally {
    button.disabled = false;
    button.textContent = "Войти";
  }
});


/* ВЫХОД */


document.getElementById("logoutButton")
  .addEventListener("click", async function() {


    const { error } = await supabase.auth.signOut();


    if (error) {
      alert("Ошибка выхода: " + error.message);
      return;
    }


    showLogin();
  });


/* ВОССТАНОВЛЕНИЕ СЕССИИ */


supabase.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") {
    showLogin();
  }
});


async function checkSession() {
  const { data, error } = await supabase.auth.getSession();


  if (error) {
    showLogin();


    showMessage(
      "loginMessage",
      error.message,
      "error"
    );


    return;
  }


  if (data.session) {
    await showAdmin(data.session.user);
  } else {
    showLogin();
  }
}


/* ЗАГРУЗКА ТОВАРОВ */


async function loadProducts() {
  productsList.innerHTML = "<p>Загрузка товаров...</p>";


  try {
    const { data, error } = await supabase
      .from("products")
      .select("*")
      .order("created_at", { ascending: false });


    if (error) throw error;


    products = data || [];


    renderProducts();


  } catch (error) {
    productsList.textContent =
      "Не удалось загрузить товары: " + error.message;


    document.getElementById("productCount").textContent =
      "Ошибка загрузки";
  }
}


/* ЗАГРУЗКА ФОТОГРАФИИ */


imageInput.addEventListener("change", function() {
  const file = this.files[0];


  selectedImage = null;


  if (!file) return;


  if (!file.type.startsWith("image/")) {
    alert("Выбери файл изображения.");
    this.value = "";
    return;
  }


  if (file.size > 1024 * 1024) {
    alert("Фотография должна быть меньше 1 МБ.");
    this.value = "";
    return;
  }


  selectedImage = file;


  const reader = new FileReader();


  reader.onload = function(event) {
    preview.src = event.target.result;
    preview.style.display = "block";


    document.getElementById("imageStatus").textContent =
      "Новая фотография выбрана.";
  };


  reader.onerror = function() {
    alert("Не удалось прочитать фотографию.");
  };


  reader.readAsDataURL(file);
});


/* ОТПРАВКА ФОТО В STORAGE */


async function uploadImage(file) {
  const extension =
    file.name.split(".").pop().toLowerCase();


  const allowedExtensions = [
    "jpg", "jpeg", "png", "webp", "gif"
  ];


  if (!allowedExtensions.includes(extension)) {
    throw new Error("Поддерживаются JPG, PNG, WEBP и GIF.");
  }


  const fileName =
    Date.now() + "-" +
    crypto.randomUUID() + "." +
    extension;


  const { error } = await supabase.storage
    .from("product-images")
    .upload(fileName, file, {
      cacheControl: "3600",
      upsert: false
    });


  if (error) throw error;


  const { data } = supabase.storage
    .from("product-images")
    .getPublicUrl(fileName);


  return data.publicUrl;
}


/* ДОБАВЛЕНИЕ И РЕДАКТИРОВАНИЕ */


productForm.addEventListener("submit", async function(event) {
  event.preventDefault();


  if (!currentUser || currentUser.id !== ADMIN_UID) {
    alert("Сначала войди как администратор.");
    return;
  }


  const name =
    document.getElementById("name").value.trim();


  const price =
    Number(document.getElementById("price").value);


  const oldPriceValue =
    document.getElementById("oldPrice").value;


  const oldPrice = oldPriceValue
    ? Number(oldPriceValue)
    : null;


  const category =
    document.getElementById("category").value;


  const description =
    document.getElementById("description").value.trim();


  if (
    !name ||
    !category ||
    !Number.isFinite(price) ||
    price <= 0
  ) {
    alert("Проверь название, категорию и цену.");
    return;
  }


  if (
    oldPrice !== null &&
    (!Number.isFinite(oldPrice) || oldPrice < 0)
  ) {
    alert("Проверь старую цену.");
    return;
  }


  const button = document.getElementById("submitButton");


  button.disabled = true;
  button.textContent = "Сохранение...";


  clearMessage("formMessage");


  try {
    let imageUrl = "";


    if (editingId !== null) {
      const oldProduct = products.find(
        product => String(product.id) === String(editingId)
      );


      imageUrl = oldProduct?.image_url || "";
    }


    if (selectedImage) {
      imageUrl = await uploadImage(selectedImage);
    }


    const productData = {
      name,
      price,
      old_price: oldPrice,
      category,
      description,
      image_url: imageUrl,
      is_active: true
    };


    if (editingId !== null) {
      const { error } = await supabase
        .from("products")
        .update(productData)
        .eq("id", editingId);


      if (error) throw error;


      showMessage(
        "formMessage",
        "Товар успешно обновлён!",
        "success"
      );


    } else {
      const { error } = await supabase
        .from("products")
        .insert([productData]);


      if (error) throw error;


      showMessage(
        "formMessage",
        "Товар успешно добавлен!",
        "success"
      );
    }


    cancelEdit();
    await loadProducts();


  } catch (error) {
    showMessage(
      "formMessage",
      "Ошибка сохранения: " + error.message,
      "error"
    );
  } finally {
    button.disabled = false;


    button.textContent =
      editingId !== null
        ? "Сохранить изменения"
        : "Добавить товар";
  }
});


/* РЕДАКТИРОВАНИЕ */


function editProduct(id) {
  const product = products.find(
    item => String(item.id) === String(id)
  );


  if (!product) return;


  editingId = product.id;
  selectedImage = null;


  document.getElementById("name").value =
    product.name || "";


  document.getElementById("price").value =
    product.price ?? "";


  document.getElementById("oldPrice").value =
    product.old_price ?? "";


  document.getElementById("category").value =
    product.category || "";


  document.getElementById("description").value =
    product.description || "";


  imageInput.value = "";


  if (product.image_url) {
    preview.src = product.image_url;
    preview.style.display = "block";


    document.getElementById("imageStatus").textContent =
      "Оставь старую фотографию или выбери новую.";
  } else {
    preview.style.display = "none";


    document.getElementById("imageStatus").textContent =
      "Фотография не загружена.";
  }


  document.getElementById("formTitle").textContent =
    "Редактировать товар";


  document.getElementById("submitButton").textContent =
    "Сохранить изменения";


  document.getElementById("cancelButton")
    .classList.remove("hidden");


  document.querySelector(".panel").scrollIntoView({
    behavior: "smooth"
  });
}


/* ОТМЕНА РЕДАКТИРОВАНИЯ */


function cancelEdit() {
  editingId = null;
  selectedImage = null;


  productForm.reset();


  imageInput.value = "";


  preview.src = "";
  preview.style.display = "none";


  document.getElementById("formTitle").textContent =
    "Добавить товар";


  document.getElementById("submitButton").textContent =
    "Добавить товар";


  document.getElementById("cancelButton")
    .classList.add("hidden");


  document.getElementById("imageStatus").textContent =
    "Максимальный размер фотографии — 1 МБ.";
}


document.getElementById("cancelButton")
  .addEventListener("click", cancelEdit);


/* УДАЛЕНИЕ */


async function deleteProduct(id) {
  if (!currentUser || currentUser.id !== ADMIN_UID) {
    alert("Нет прав администратора.");
    return;
  }


  if (!confirm("Удалить этот товар?")) return;


  try {
    const { error } = await supabase
      .from("products")
      .delete()
      .eq("id", id);


    if (error) throw error;


    if (String(editingId) === String(id)) {
      cancelEdit();
    }


    await loadProducts();


  } catch (error) {
    alert("Не удалось удалить товар: " + error.message);
  }
}


/* ОТОБРАЖЕНИЕ ТОВАРОВ */


function renderProducts() {
  document.getElementById("productCount").textContent =
    "Всего товаров: " + products.length;


  productsList.innerHTML = "";


  if (products.length === 0) {
    productsList.innerHTML =
      "<p>Пока товаров нет. Добавь первый товар выше.</p>";


    return;
  }


  products.forEach(product => {
    const item = document.createElement("div");
    item.className = "product";


    const img = document.createElement("img");


    img.alt = product.name || "Товар";
    img.src = product.image_url || "";


    const info = document.createElement("div");
    info.className = "product-info";


    const title = document.createElement("strong");
    title.textContent = product.name || "Без названия";


    const details = document.createElement("p");


    details.textContent =
      Number(product.price || 0).toFixed(2) +
      " € · " +
      (product.category || "Без категории") +
      (
        product.old_price !== null &&
        product.old_price !== undefined
          ? " · Старая цена: " +
            Number(product.old_price).toFixed(2) + " €"
          : ""
      );


    const description = document.createElement("p");


    description.textContent =
      product.description || "Описание не добавлено.";


    const actions = document.createElement("div");
    actions.className = "product-actions";


    const editButton = document.createElement("button");
    editButton.className = "edit";
    editButton.textContent = "Изменить";


    editButton.addEventListener("click", function() {
      editProduct(product.id);
    });


    const deleteButton = document.createElement("button");
    deleteButton.className = "delete";
    deleteButton.textContent = "Удалить";


    deleteButton.addEventListener("click", function() {
      deleteProduct(product.id);
    });


    actions.append(editButton, deleteButton);
    info.append(title, details, description);
    item.append(img, info, actions);


    productsList.appendChild(item);
  });
}


/* ЗАПУСК */


checkSession();


</script>


</body>
</html>
